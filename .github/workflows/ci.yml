name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

env:
  ZIG_VERSION: "0.13.0"

jobs:
  # --------------------------------------------------------------- build ---
  build-test:
    name: build + test (${{ matrix.optimize }})
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        optimize: [Debug, ReleaseSafe]
    steps:
      - uses: actions/checkout@v4

      - uses: goto-bus-stop/setup-zig@v2
        with:
          version: ${{ env.ZIG_VERSION }}

      - uses: actions/cache@v4
        with:
          path: .zig-cache
          key: zig-${{ runner.os }}-${{ env.ZIG_VERSION }}-${{ matrix.optimize }}-${{ hashFiles('src/**', 'assets/**', 'examples/**', 'build.zig', 'build.zig.zon') }}
          restore-keys: |
            zig-${{ runner.os }}-${{ env.ZIG_VERSION }}-${{ matrix.optimize }}-

      - name: Compile weave
        run: zig build -Doptimize=${{ matrix.optimize }}

      # assets/weave-core.wasm is the in-page engine that `weave build --html`
      # embeds. It is committed (so a plain clone can export pages) and
      # regenerated by `zig build wasm`; the build is byte-for-byte
      # reproducible, so a stale blob fails here rather than in someone's
      # browser.
      - name: In-page engine blob is up to date
        if: matrix.optimize == 'Debug'
        run: |
          set -euo pipefail
          # A restored .zig-cache can be missing a cached output. The build is
          # reproducible, so retrying without the cache gives the same bytes.
          zig build wasm || { rm -rf .zig-cache; zig build wasm; }
          git diff --exit-code assets/weave-core.wasm
          printf 'weave-core.wasm: %s bytes, up to date\n' "$(stat -c%s assets/weave-core.wasm)"

      # Debug only: the test binaries are pinned to Debug in build.zig so that
      # safety checks and leak detection stay on in every mode.
      - name: Unit tests (lexer, parser, compiler, VM, reactivity, diff)
        run: zig build test

      - name: End-to-end test (real HTTP + WebSocket server, hot reload)
        run: zig build itest

      - name: Compile, render and drive every bundled example
        run: zig build examples

      - name: CLI smoke test
        run: |
          set -euo pipefail
          weave=./zig-out/bin/weave

          "$weave" version
          "$weave" check examples/*.weave
          "$weave" check tests/*.weave
          "$weave" ast examples/todo.weave > /dev/null
          "$weave" dump examples/todo.weave > /dev/null

          # `weave new` must scaffold an app that compiles immediately.
          "$weave" new demo-app
          "$weave" check demo-app.weave

      - name: Export smoke test (.html page and standalone executable)
        run: |
          set -euo pipefail
          weave=./zig-out/bin/weave
          mkdir -p out

          # One self-contained page: engine, bytecode, styles and client inline.
          "$weave" build examples/todo.weave --html out/todo.html
          node tools/check-html.mjs out/todo.html

          # The same app as an executable that carries its own bytecode. It is
          # still a full weave, so it can check, compile and re-package.
          "$weave" build examples/todo.weave --exe out/todoapp
          chmod +x out/todoapp
          ./out/todoapp --selftest
          ./out/todoapp version
          ./out/todoapp check examples/*.weave
          ./out/todoapp build examples/counter.weave --html out/counter.html
          node tools/check-html.mjs out/counter.html

          # Re-packaging a packaged binary must not nest payloads: both files
          # are the same engine plus a ~2 KB app, so their sizes stay close.
          ./out/todoapp build examples/counter.weave --exe out/counterapp
          ./out/counterapp --selftest
          a=$(stat -c%s out/todoapp); b=$(stat -c%s out/counterapp)
          test $(( b > a ? b - a : a - b )) -lt 65536

          # Bytecode stays the default, and a .wvbc runs and re-exports.
          "$weave" build examples/todo.weave -o out/todo.wvbc
          "$weave" run out/todo.wvbc --selftest
          "$weave" build out/todo.wvbc --html out/from-bytecode.html
          node tools/check-html.mjs out/from-bytecode.html

          # The whole-language fixture as a page: 28 signals, 52 functions,
          # components, effects and a handler that raises on purpose. The check
          # renders it and drives every listener, so the note it prints is the
          # deliberate error, not a broken export.
          "$weave" build tests/features.weave --html out/features.html
          node tools/check-html.mjs out/features.html

      - name: Upload binary
        uses: actions/upload-artifact@v4
        with:
          name: weave-linux-x86_64-${{ matrix.optimize }}
          path: zig-out/bin/weave
          if-no-files-found: error

  # ------------------------------------------------------- pre-compiled ----
  # The compiler runs headless in CI: every example is turned into a .wvbc
  # bytecode artifact and then loaded back to prove the format round-trips.
  precompile:
    name: pre-compile examples to .wvbc
    runs-on: ubuntu-latest
    needs: build-test
    steps:
      - uses: actions/checkout@v4

      - uses: goto-bus-stop/setup-zig@v2
        with:
          version: ${{ env.ZIG_VERSION }}

      - uses: actions/cache@v4
        with:
          path: .zig-cache
          key: zig-${{ runner.os }}-${{ env.ZIG_VERSION }}-ReleaseSafe-${{ hashFiles('src/**', 'assets/**', 'examples/**', 'build.zig', 'build.zig.zon') }}
          restore-keys: |
            zig-${{ runner.os }}-${{ env.ZIG_VERSION }}-ReleaseSafe-

      - name: Build the compiler
        run: zig build -Doptimize=ReleaseSafe

      - name: Compile examples/*.weave -> examples-bin/*.wvbc
        run: |
          set -euo pipefail
          mkdir -p examples-bin
          for src in examples/*.weave; do
            out="examples-bin/$(basename "$src" .weave).wvbc"
            ./zig-out/bin/weave build "$src" -o "$out"
          done

      # A page per example: open one of these in a browser and the app runs with
      # no server, no build step and nothing installed.
      - name: Export examples/*.weave -> examples-html/*.html
        run: |
          set -euo pipefail
          mkdir -p examples-html
          for src in examples/*.weave; do
            stem="$(basename "$src" .weave)"
            ./zig-out/bin/weave build "$src" --html "examples-html/$stem.html"
          done

      - name: Boot every exported page
        run: node tools/check-html.mjs examples-html/*.html

      - name: Load every artifact back
        run: |
          set -euo pipefail
          ./zig-out/bin/weave check examples-bin/*.wvbc
          for bc in examples-bin/*.wvbc; do
            ./zig-out/bin/weave dump "$bc" > /dev/null
            printf '%-28s %s bytes\n' "$bc" "$(stat -c%s "$bc")"
          done

      - name: Upload pre-compiled examples
        uses: actions/upload-artifact@v4
        with:
          name: weave-examples-wvbc
          path: examples-bin/
          if-no-files-found: error

      - name: Upload single-file example apps
        uses: actions/upload-artifact@v4
        with:
          name: weave-examples-html
          path: examples-html/
          if-no-files-found: error

  # --------------------------------------------------------- portability ---
  # The same matrix release.yml ships, compiled on every pull request so a
  # broken target is caught before a tag is pushed.
  cross-compile:
    name: cross-compile ${{ matrix.name }}
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        include:
          - { name: x86_64-linux-musl,   target: x86_64-linux-musl,   runs-here: true }
          - { name: x86_64-linux-gnu,    target: x86_64-linux-gnu,    runs-here: true }
          - { name: aarch64-linux-gnu,   target: aarch64-linux-gnu,   runs-here: false }
          - { name: x86_64-macos,        target: x86_64-macos-none,   runs-here: false }
          - { name: aarch64-macos,       target: aarch64-macos-none,  runs-here: false }
          - { name: x86_64-windows,      target: x86_64-windows-gnu,  runs-here: false }
    steps:
      - uses: actions/checkout@v4

      - uses: goto-bus-stop/setup-zig@v2
        with:
          version: ${{ env.ZIG_VERSION }}

      - uses: actions/cache@v4
        with:
          path: .zig-cache
          key: zig-${{ runner.os }}-${{ env.ZIG_VERSION }}-cross-${{ matrix.target }}-${{ hashFiles('src/**', 'assets/**', 'build.zig', 'build.zig.zon') }}
          restore-keys: |
            zig-${{ runner.os }}-${{ env.ZIG_VERSION }}-cross-${{ matrix.target }}-

      - name: Build for ${{ matrix.target }}
        run: zig build -Dtarget=${{ matrix.target }} -Doptimize=ReleaseSafe --prefix dist/${{ matrix.name }}

      - name: Smoke test the produced binary
        if: matrix.runs-here
        run: |
          set -euo pipefail
          weave=dist/${{ matrix.name }}/bin/weave
          "$weave" version
          "$weave" check examples/*.weave
          "$weave" check tests/*.weave

          # A release-optimised, statically linked weave must still be able to
          # hand out an app that runs with nothing else installed.
          "$weave" build examples/todo.weave --exe /tmp/todoapp
          /tmp/todoapp --selftest
          "$weave" build examples/todo.weave --html /tmp/todo.html
          node tools/check-html.mjs /tmp/todo.html

      - name: Upload
        uses: actions/upload-artifact@v4
        with:
          name: weave-${{ matrix.name }}
          path: dist/${{ matrix.name }}/
          if-no-files-found: error
